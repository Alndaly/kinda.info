name: hot snapshot

# The site reads this branch; it never polls a source itself. Running here
# means the six sources see one caller on a schedule instead of one per
# visitor, and it is the only way an event can have a first-seen time.
on:
  schedule:
    # GitHub's scheduler is best-effort and skews under load, which is fine:
    # the script records when it actually ran, not when it was due.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Two runs folding into the same state file would lose one of them.
concurrency:
  group: hot-snapshot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the script
        uses: actions/checkout@v5
        with:
          path: site

      - name: Check out the data branch
        uses: actions/checkout@v5
        with:
          ref: hot-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Poll the boards
        run: node site/scripts/hot-snapshot.mjs data/state.json

      - name: Publish
        working-directory: data
        run: |
          if git diff --quiet -- state.json; then
            echo "nothing moved"
            exit 0
          fi
          git config user.name 'hot-snapshot'
          git config user.email 'hot-snapshot@users.noreply.github.com'
          git add state.json
          # Amended onto one commit and force-pushed on purpose. A commit every
          # half hour is 17k a year; the history worth keeping lives inside the
          # file (firstSeen, polls, peakSources), not in the log.
          git commit --amend -m "hot: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force-with-lease origin HEAD:hot-data
