<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Lolama project cover</title>
  <desc id="desc">A habit grid filling in across an iPhone and a watch, for the multi-platform discipline app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1613"/>
      <stop offset="1" stop-color="#1d3a30"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45b08c"/>
      <stop offset="1" stop-color="#9ce8b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1058" cy="96" r="290" fill="#45b08c" opacity=".12"/>

  <!-- habit grid: the streak fills from the left and thins out towards today -->
  <g transform="translate(94 452)">
    <g fill="url(#jade)">
      <rect width="34" height="34" rx="9"/>
      <rect x="46" width="34" height="34" rx="9"/>
      <rect x="92" width="34" height="34" rx="9"/>
      <rect x="138" width="34" height="34" rx="9" opacity=".82"/>
      <rect x="184" width="34" height="34" rx="9" opacity=".64"/>
      <rect x="276" width="34" height="34" rx="9" opacity=".4"/>
      <rect y="46" width="34" height="34" rx="9" opacity=".72"/>
      <rect x="46" y="46" width="34" height="34" rx="9" opacity=".52"/>
      <rect x="138" y="46" width="34" height="34" rx="9" opacity=".34"/>
      <rect x="230" y="46" width="34" height="34" rx="9" opacity=".22"/>
    </g>
    <g fill="#ffffff" opacity=".08">
      <rect x="230" width="34" height="34" rx="9"/>
      <rect x="92" y="46" width="34" height="34" rx="9"/>
      <rect x="184" y="46" width="34" height="34" rx="9"/>
      <rect x="276" y="46" width="34" height="34" rx="9"/>
    </g>
  </g>

  <!-- the same streak, on a phone and a watch -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".22">
    <rect x="784" y="286" width="196" height="384" rx="34"/>
    <rect x="1032" y="392" width="112" height="132" rx="30"/>
  </g>
  <g fill="url(#jade)" opacity=".92">
    <rect x="812" y="330" width="140" height="12" rx="6"/>
    <rect x="812" y="360" width="88" height="12" rx="6" opacity=".55"/>
    <rect x="812" y="410" width="140" height="52" rx="14" opacity=".26"/>
    <rect x="812" y="476" width="140" height="52" rx="14" opacity=".18"/>
    <rect x="1056" y="424" width="64" height="10" rx="5"/>
    <rect x="1056" y="448" width="40" height="10" rx="5" opacity=".5"/>
  </g>
  <circle cx="1088" cy="486" r="18" fill="none" stroke="url(#jade)" stroke-width="5" stroke-dasharray="85 28" transform="rotate(-90 1088 486)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#effaf4">
    <text x="94" y="94" font-size="18" font-weight="700" letter-spacing="7">NATIVE DISCIPLINE APP</text>
    <text x="88" y="322" font-size="120" font-weight="800" letter-spacing="-6">LOLAMA</text>
    <text x="96" y="382" font-size="22" letter-spacing="5" opacity=".58">SWIFTUI · IOS · MACOS · WATCH</text>
  </g>
</svg>
